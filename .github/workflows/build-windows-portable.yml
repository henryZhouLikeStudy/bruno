name: Build Windows Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build schema-types
        run: npm run build:schema-types

      - name: Build bruno-common
        run: npm run build:bruno-common

      - name: Bundle JS sandbox libraries
        run: npm run sandbox:bundle-libraries --workspace=packages/bruno-js

      - name: Build bruno-requests
        run: npm run build:bruno-requests

      - name: Build bruno-filestore
        run: npm run build:bruno-filestore

      - name: Build bruno-sqlite
        run: npm run build:bruno-sqlite

      - name: Build bruno-converters
        run: npm run build:bruno-converters

      - name: Build bruno-query
        run: npm run build:bruno-query

      - name: Build graphql-docs
        run: npm run build:graphql-docs

      - name: Build web
        run: npm run build:web

      - name: Prepare Electron web assets
        shell: pwsh
        run: |
          $outDir = "packages/bruno-electron/out"
          $webDir = "packages/bruno-electron/web"

          if (Test-Path $outDir) { Remove-Item -Recurse -Force $outDir }
          if (Test-Path $webDir) { Remove-Item -Recurse -Force $webDir }
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null

          Copy-Item -Recurse -Force "packages/bruno-app/dist/*" $webDir

          Get-ChildItem -Path $webDir -Filter "*.html" -File | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace '/static', './static'
            Set-Content -Path $_.FullName -Value $content -NoNewline
          }

          $cssDir = "$webDir/static/css"
          if (Test-Path $cssDir) {
            Get-ChildItem -Path $cssDir -Filter "*.css" -File | ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              $content = $content -replace '/static/font', '../../static/font'
              Set-Content -Path $_.FullName -Value $content -NoNewline
            }
          }

          Get-ChildItem -Path $webDir -Filter "*.map" -Recurse -File | Remove-Item -Force

      - name: Build NSIS installer (x64)
        working-directory: packages/bruno-electron
        run: npx electron-builder --win nsis --x64 --config electron-builder-config.js --publish never

      - name: Copy NSIS installer to artifacts
        shell: pwsh
        run: |
          $outDir = "packages/bruno-electron/out"
          $exeFiles = @(Get-ChildItem -Path $outDir -Filter "*.exe" -File)
          if ($exeFiles.Count -ne 1) {
            throw "Expected exactly one top-level EXE in $outDir, found $($exeFiles.Count)"
          }
          New-Item -ItemType Directory -Force -Path "artifacts/installer" | Out-Null
          Copy-Item -Force $exeFiles[0].FullName "artifacts/installer/Bruno_zh-CN_Windows_x64_Setup.exe"

      - name: Remove NSIS output
        shell: pwsh
        run: Remove-Item -Recurse -Force "packages/bruno-electron/out"

      - name: Build portable (x64)
        working-directory: packages/bruno-electron
        run: npx electron-builder --win portable --x64 --config electron-builder-config.js --publish never

      - name: Verify portable app bundle
        shell: pwsh
        run: |
          $asar = "packages/bruno-electron/out/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) {
            throw "$asar not found"
          }
          $entries = node node_modules/@electron/asar/bin/asar.js list $asar
          $target = "\node_modules\@usebruno\js\src\sandbox\bundle-browser-rollup.js"
          if ($entries -notcontains $target) {
            throw "Missing required asar entry: $target"
          }

      - name: Copy portable to artifacts
        shell: pwsh
        run: |
          $outDir = "packages/bruno-electron/out"
          $exeFiles = @(Get-ChildItem -Path $outDir -Filter "*.exe" -File)
          if ($exeFiles.Count -ne 1) {
            throw "Expected exactly one top-level EXE in $outDir, found $($exeFiles.Count)"
          }
          New-Item -ItemType Directory -Force -Path "artifacts/portable" | Out-Null
          Copy-Item -Force $exeFiles[0].FullName "artifacts/portable/Bruno_zh-CN_Windows_x64_Portable.exe"

      - name: Stage NoAdmin portable directory
        shell: pwsh
        run: |
          # Normalize to native absolute Windows paths for robocopy.
          $source = (Resolve-Path "packages/bruno-electron/out/win-unpacked").Path
          $stageRoot = Join-Path (Join-Path $PWD.Path "artifacts") "portable-noadmin"
          $stage = Join-Path $stageRoot "Bruno_zh-CN_Windows_x64_Portable_NoAdmin"

          # app.asar.unpacked may be absent depending on dependency packaging,
          # so only these files are required.
          $required = @(
            "Bruno.exe",
            "resources/app.asar",
            "locales/zh-CN.pak",
            "resources/data/sample-collection.json"
          )

          # Validate the source bundle before copying/compression.
          foreach ($rel in $required) {
            $p = Join-Path $source $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Required file missing in win-unpacked: $p"
            }
          }

          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }

          # robocopy is the reliable Windows tool for large/deep directory copies.
          # Exit codes 0-7 are success (1 = files copied); >= 8 is a real failure.
          robocopy $source $stage /E /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          # Reset so GitHub Actions' trailing `exit $LASTEXITCODE` does not treat
          # robocopy success codes 1-7 as a step failure.
          $global:LASTEXITCODE = 0
          if ($robocopyExit -ge 8) {
            throw "robocopy failed with exit code $robocopyExit"
          }

          # Re-validate the staged copies before compression.
          foreach ($rel in $required) {
            $p = Join-Path $stage $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Staged file missing: $p"
            }
          }
          Write-Host "Staged NoAdmin portable directory: $stage"

      - name: Create NoAdmin ZIP
        working-directory: artifacts/portable-noadmin
        shell: pwsh
        run: |
          # 7-Zip is preinstalled on windows-latest and handles large/deep trees reliably.
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip not found at $sevenZip (expected on windows-latest)"
          }
          # Run from artifacts/portable-noadmin and pass the bare folder name so
          # 7-Zip stores exactly one top-level directory (no artifacts/... prefix).
          $zip = "Bruno_zh-CN_Windows_x64_Portable_NoAdmin.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          & $sevenZip a -tzip -bso0 -bsp0 $zip "Bruno_zh-CN_Windows_x64_Portable_NoAdmin"
          if ($LASTEXITCODE -ne 0) {
            throw "7z failed with exit code $LASTEXITCODE"
          }
          Write-Host "Created $zip"

      - name: Verify NoAdmin ZIP round-trip
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $zip = "artifacts/portable-noadmin/Bruno_zh-CN_Windows_x64_Portable_NoAdmin.zip"
          $verifyRoot = "artifacts/verification/portable-noadmin"
          if (Test-Path $verifyRoot) { Remove-Item -Recurse -Force $verifyRoot }
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null

          & $sevenZip x -y -bso0 -bsp0 "-o$verifyRoot" $zip
          if ($LASTEXITCODE -ne 0) {
            throw "7z extraction failed with exit code $LASTEXITCODE"
          }

          # Assert the archive contains exactly one top-level directory with the
          # expected name (no artifacts/... prefix, no extra entries).
          $topLevel = @(Get-ChildItem -Path $verifyRoot -Force)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -ne "Bruno_zh-CN_Windows_x64_Portable_NoAdmin" -or -not $topLevel[0].PSIsContainer) {
            throw "Expected exactly one top-level directory 'Bruno_zh-CN_Windows_x64_Portable_NoAdmin' in $zip, found: $(($topLevel | ForEach-Object { $_.Name }) -join ', ')"
          }

          $extracted = "$verifyRoot/Bruno_zh-CN_Windows_x64_Portable_NoAdmin"
          $required = @(
            "Bruno.exe",
            "resources/app.asar",
            "locales/zh-CN.pak",
            "resources/data/sample-collection.json"
          )
          foreach ($rel in $required) {
            $p = Join-Path $extracted $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Required file missing after round-trip extraction: $p"
            }
          }
          Write-Host "Round-trip verification OK: $zip"

      - name: Stage NoElevate experimental portable directory
        shell: pwsh
        run: |
          # Normalize to native absolute Windows paths for robocopy.
          $source = (Resolve-Path "artifacts/portable-noadmin/Bruno_zh-CN_Windows_x64_Portable_NoAdmin").Path
          $stageRoot = Join-Path (Join-Path $PWD.Path "artifacts") "portable-noelevate"
          $stage = Join-Path $stageRoot "Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate"

          $required = @(
            "Bruno.exe",
            "resources/app.asar",
            "locales/zh-CN.pak",
            "resources/data/sample-collection.json"
          )

          # The NoElevate variant is derived from NoAdmin by removing elevate.exe.
          $elevateSource = Join-Path $source "resources/elevate.exe"
          if (-not (Test-Path $elevateSource -PathType Leaf)) {
            throw "Source elevate.exe missing: $elevateSource"
          }

          foreach ($rel in $required) {
            $p = Join-Path $source $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Required file missing in NoAdmin source: $p"
            }
          }

          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }

          robocopy $source $stage /E /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($robocopyExit -ge 8) {
            throw "robocopy failed with exit code $robocopyExit"
          }

          $elevateTarget = Join-Path $stage "resources/elevate.exe"
          if (-not (Test-Path $elevateTarget -PathType Leaf)) {
            throw "Copied elevate.exe missing: $elevateTarget"
          }
          Remove-Item -Force $elevateTarget
          if (Test-Path $elevateTarget -PathType Leaf) {
            throw "elevate.exe was not removed: $elevateTarget"
          }

          foreach ($rel in $required) {
            $p = Join-Path $stage $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Staged file missing: $p"
            }
          }
          Write-Host "Staged NoElevate portable directory: $stage"

      - name: Create NoElevate ZIP
        working-directory: artifacts/portable-noelevate
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip not found at $sevenZip (expected on windows-latest)"
          }
          $zip = "Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          & $sevenZip a -tzip -bso0 -bsp0 $zip "Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate"
          if ($LASTEXITCODE -ne 0) {
            throw "7z failed with exit code $LASTEXITCODE"
          }
          Write-Host "Created $zip"

      - name: Verify NoElevate ZIP round-trip
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $zip = "artifacts/portable-noelevate/Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate.zip"
          $verifyRoot = "artifacts/verification/portable-noelevate"
          if (Test-Path $verifyRoot) { Remove-Item -Recurse -Force $verifyRoot }
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null

          & $sevenZip x -y -bso0 -bsp0 "-o$verifyRoot" $zip
          if ($LASTEXITCODE -ne 0) {
            throw "7z extraction failed with exit code $LASTEXITCODE"
          }

          $topLevel = @(Get-ChildItem -Path $verifyRoot -Force)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -ne "Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate" -or -not $topLevel[0].PSIsContainer) {
            throw "Expected exactly one top-level directory 'Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate' in $zip, found: $(($topLevel | ForEach-Object { $_.Name }) -join ', ')"
          }

          $extracted = "$verifyRoot/Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate"
          $required = @(
            "Bruno.exe",
            "resources/app.asar",
            "locales/zh-CN.pak",
            "resources/data/sample-collection.json"
          )
          foreach ($rel in $required) {
            $p = Join-Path $extracted $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Required file missing after round-trip extraction: $p"
            }
          }

          $elevateExtracted = Join-Path $extracted "resources/elevate.exe"
          if (Test-Path $elevateExtracted -PathType Leaf) {
            throw "elevate.exe must not be present in NoElevate archive: $elevateExtracted"
          }
          Write-Host "Round-trip verification OK: $zip"

      - name: Verify artifacts and print SHA256
        shell: pwsh
        run: |
          $files = @(
            "artifacts/installer/Bruno_zh-CN_Windows_x64_Setup.exe",
            "artifacts/portable/Bruno_zh-CN_Windows_x64_Portable.exe",
            "artifacts/portable-noadmin/Bruno_zh-CN_Windows_x64_Portable_NoAdmin.zip",
            "artifacts/portable-noelevate/Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate.zip"
          )
          foreach ($file in $files) {
            $info = Get-Item $file
            if ($info.Length -eq 0) {
              throw "$file is empty"
            }
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash
            Write-Host "$file size=$($info.Length) bytes SHA256=$hash"
          }

          # The NoAdmin ZIP contains the full win-unpacked bundle (hundreds of MB
          # unpacked), so a 10 MB floor is a safe sanity check against a truncated
          # or corrupt archive without being brittle.
          $noAdminZip = Get-Item "artifacts/portable-noadmin/Bruno_zh-CN_Windows_x64_Portable_NoAdmin.zip"
          if ($noAdminZip.Length -lt 10MB) {
            throw "NoAdmin ZIP unexpectedly small: $($noAdminZip.Length) bytes"
          }

          $noElevateZip = Get-Item "artifacts/portable-noelevate/Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate.zip"
          if ($noElevateZip.Length -lt 10MB) {
            throw "NoElevate ZIP unexpectedly small: $($noElevateZip.Length) bytes"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bruno_zh-CN_Windows_x64_Setup
          path: artifacts/installer/Bruno_zh-CN_Windows_x64_Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bruno_zh-CN_Windows_x64_Portable
          path: artifacts/portable/Bruno_zh-CN_Windows_x64_Portable.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload NoAdmin portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bruno_zh-CN_Windows_x64_Portable_NoAdmin
          path: artifacts/portable-noadmin/Bruno_zh-CN_Windows_x64_Portable_NoAdmin.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload NoElevate portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate
          path: artifacts/portable-noelevate/Bruno_zh-CN_Windows_x64_Portable_NoAdmin_NoElevate.zip
          if-no-files-found: error
          retention-days: 7
